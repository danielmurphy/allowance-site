<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Join a family on Allowance</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      background: #f5f5f7;
      min-height: 100dvh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 24px;
    }
    .card {
      background: #fff;
      border-radius: 20px;
      padding: 40px 32px;
      max-width: 400px;
      width: 100%;
      text-align: center;
      box-shadow: 0 4px 24px rgba(0,0,0,0.08);
    }
    .icon { font-size: 56px; margin-bottom: 20px; }
    h1 { font-size: 22px; font-weight: 700; color: #1c1c1e; margin-bottom: 12px; }
    p  { font-size: 15px; color: #6e6e73; line-height: 1.5; margin-bottom: 32px; }
    .code {
      display: block;
      background: #f2f2f6;
      border-radius: 18px;
      padding: 16px;
      margin: 0 0 24px;
      font-family: ui-monospace, "SF Mono", Menlo, Consolas, monospace;
      font-size: 34px;
      font-weight: 700;
      letter-spacing: 0.12em;
      color: #1c1c1e;
      user-select: all;
      -webkit-user-select: all;
    }
    .btn-primary {
      display: block;
      background: #007AFF;
      color: #fff;
      border: none;
      border-radius: 14px;
      padding: 16px;
      font-size: 17px;
      font-weight: 600;
      text-decoration: none;
      margin-bottom: 12px;
      cursor: pointer;
    }
    .btn-secondary {
      display: block;
      color: #007AFF;
      font-size: 15px;
      text-decoration: none;
      padding: 8px;
    }
    [hidden] { display: none !important; }
  </style>
</head>
<body>
  <div class="card">
    <div class="icon">👨‍👩‍👧‍👦</div>
    <h1>Join a family on Allowance</h1>
    <p id="subtitle">Open Allowance and enter this code. A code works once, then stops.</p>
    <code id="code" class="code" hidden></code>
    <a id="open-btn" class="btn-primary" href="#" hidden>Open in Allowance</a>
    <a class="btn-secondary" href="https://apps.apple.com/app/allowance/id6743827609">Get Allowance on the App Store</a>
  </div>

  <script>
    // Expected path: /join/{CODE}. Codes are 6 chars, no 0 O 1 I; the app and
    // the functions normalise the same way (uppercase, strip spaces and dashes).
    (function () {
      var parts = window.location.pathname.replace(/^\/+|\/+$/g, '').split('/');
      var raw = parts[0] === 'join' && parts.length >= 2 ? parts[1] : '';
      var code = decodeURIComponent(raw).toUpperCase().replace(/[\s-]/g, '');

      if (/^[A-HJ-NP-Z2-9]{6}$/.test(code)) {
        document.getElementById('code').textContent = code;
        document.getElementById('code').hidden = false;
        // Use the app's custom URL scheme here, not the https universal link:
        // iOS never opens the app for a same-domain link tapped in Safari, so an
        // https:// href on this page would just reload it.
        var openBtn = document.getElementById('open-btn');
        openBtn.href = 'allowance://join/' + code;
        openBtn.hidden = false;
      } else {
        document.getElementById('subtitle').textContent =
          'This code looks incomplete. Ask the grown-up who shared it to send a new one.';
      }
    })();
  </script>
</body>
</html>
