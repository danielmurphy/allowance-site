<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Allowance</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      background: #f5f5f7;
      min-height: 100dvh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 24px;
    }
    .card {
      background: #fff;
      border-radius: 20px;
      padding: 40px 32px;
      max-width: 400px;
      width: 100%;
      text-align: center;
      box-shadow: 0 4px 24px rgba(0,0,0,0.08);
    }
    .icon { font-size: 56px; margin-bottom: 20px; }
    h1 { font-size: 22px; font-weight: 700; color: #1c1c1e; margin-bottom: 12px; }
    p  { font-size: 15px; color: #6e6e73; line-height: 1.5; margin-bottom: 32px; }
    .btn-primary {
      display: block;
      background: #007AFF;
      color: #fff;
      border: none;
      border-radius: 14px;
      padding: 16px;
      font-size: 17px;
      font-weight: 600;
      text-decoration: none;
      margin-bottom: 12px;
      cursor: pointer;
    }
    .btn-secondary {
      display: block;
      color: #007AFF;
      font-size: 15px;
      text-decoration: none;
      padding: 8px;
    }
    [hidden] { display: none !important; }
  </style>
</head>
<body>
  <div id="invite-card" class="card" hidden>
    <div class="icon">👨‍👩‍👧‍👦</div>
    <h1>You've been invited to share an Allowance family</h1>
    <p id="invite-subtitle">Open the Allowance app to accept the invitation and start managing allowances together.</p>
    <a id="open-btn" class="btn-primary" href="#">Open in Allowance</a>
    <a class="btn-secondary" href="https://apps.apple.com/app/allowance/id6743827609">Get Allowance on the App Store</a>
  </div>

  <div id="notfound-card" class="card" hidden>
    <div class="icon">🤔</div>
    <h1>Page Not Found</h1>
    <p>The page you're looking for doesn't exist.</p>
    <a class="btn-primary" href="/">Go to Allowance</a>
  </div>

  <script>
    // GitHub Pages serves this file for any unmatched URL. Universal-link invites
    // hit paths like /invite/{familyId}/{inviteId}?t={token} which have no real
    // file behind them, so detect that here and render the invite landing
    // inline. Other 404s render the generic not-found card.
    (function () {
      var parts = window.location.pathname.replace(/^\/+|\/+$/g, '').split('/');
      var isInvitePath = parts[0] === 'invite' && parts.length >= 3;
      var familyId = isInvitePath ? parts[1] : '';
      var inviteId = isInvitePath ? parts[2] : '';
      var token = new URLSearchParams(window.location.search).get('t') || '';

      if (isInvitePath) {
        document.getElementById('invite-card').hidden = false;
        if (familyId && inviteId && token) {
          var deepLink = 'https://getallowance.app/invite/' + familyId + '/' + inviteId
            + '?t=' + encodeURIComponent(token);
          document.getElementById('open-btn').href = deepLink;
        } else {
          document.getElementById('open-btn').style.display = 'none';
          document.getElementById('invite-subtitle').textContent =
            'This invite link looks incomplete. Ask the person who shared it to send a new one.';
        }
      } else {
        document.getElementById('notfound-card').hidden = false;
      }
    })();
  </script>
</body>
</html>
